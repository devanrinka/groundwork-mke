<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groundwork · Development Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-dark: #085041;
      --amber: #BA7517;
      --amber-light: #FAEEDA;
      --amber-dark: #633806;
      --blue: #378ADD;
      --blue-light: #E6F1FB;
      --blue-dark: #0C447C;
      --text: #1a1a1a;
      --text-muted: #666;
      --text-faint: #999;
      --border: #e5e5e5;
      --bg: #f7f6f2;
      --card: #ffffff;
    }

    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }

    .top-bar { height: 3px; background: var(--green); }
    .container { max-width: 880px; margin: 0 auto; padding: 0 24px; }

    header { padding: 28px 0 0; border-bottom: 0.5px solid var(--border); margin-bottom: 20px; }

    .header-inner { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }

    .logo { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 400; letter-spacing: 0.5px; color: var(--text); line-height: 1; }
    .logo-sub { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-faint); margin-top: 6px; font-weight: 300; }

    .edition-block { text-align: right; }
    .edition-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green); font-weight: 500; }
    .edition-date { font-size: 14px; font-weight: 500; color: var(--text); margin-top: 3px; }
    .edition-next { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

    .city-tabs { display: flex; gap: 0; }
    .city-tab {
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 400;
      padding: 10px 20px; border: none; background: transparent;
      color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.15s; white-space: nowrap;
    }
    .city-tab:hover { color: var(--text); }
    .city-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }

    .meta-bar { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted); padding: 10px 0; border-bottom: 0.5px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; }
    .meta-sep { color: var(--border); }

    .filters { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }
    .filter-btn { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 400; padding: 5px 14px; border: 0.5px solid var(--border); border-radius: 20px; background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .filter-btn:hover { border-color: #aaa; color: var(--text); }
    .filter-btn.active { background: var(--text); color: var(--card); border-color: var(--text); }
    .filter-count { margin-left: 4px; opacity: 0.5; font-size: 11px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; margin-bottom: 48px; }

    .card { background: var(--card); border: 0.5px solid var(--border); border-left-width: 3px; border-radius: 10px; padding: 16px 18px 14px 18px; transition: box-shadow 0.15s; }
    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .type-badge { font-size: 10px; font-weight: 500; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .card-status { font-size: 11px; color: var(--text-faint); text-align: right; max-width: 120px; line-height: 1.4; }
    .card-name { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 400; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
    .card-location { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .card-scale { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 4px; margin-bottom: 10px; }
    .card-credits { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.8; }
    .card-credits span { font-weight: 500; color: var(--text); }
    .card-summary { font-size: 13px; color: var(--text-muted); line-height: 1.65; border-top: 0.5px solid var(--border); padding-top: 10px; margin-bottom: 10px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    .card-source { font-size: 11px; color: var(--text-faint); }
    .card-link { font-size: 11px; color: var(--green); text-decoration: none; font-weight: 500; }
    .card-link:hover { text-decoration: underline; }

    .archive-section { margin-bottom: 48px; }
    .archive-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-faint); font-weight: 500; margin-bottom: 12px; }
    .archive-list { display: flex; flex-direction: column; gap: 1px; }
    .archive-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--card); border: 0.5px solid var(--border); border-radius: 6px; cursor: pointer; transition: background 0.1s; }
    .archive-item:hover { background: #f0efe9; }
    .archive-item.active { border-color: var(--green); }
    .archive-item-date { font-size: 13px; font-weight: 500; }
    .archive-item-count { font-size: 12px; color: var(--text-faint); }

    footer { border-top: 0.5px solid var(--border); padding: 20px 0 32px; font-size: 11px; color: var(--text-faint); display: flex; justify-content: space-between; align-items: center; }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 48px; color: var(--text-faint); font-size: 14px; }
    .loading { grid-column: 1 / -1; text-align: center; padding: 48px; color: var(--text-faint); font-size: 13px; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .header-inner { flex-direction: column; gap: 12px; }
      .edition-block { text-align: left; }
      footer { flex-direction: column; gap: 8px; text-align: center; }
      .city-tab { font-size: 12px; padding: 10px 14px; }
    }
  </style>
</head>
<body>

<div class="top-bar"></div>

<div class="container">
  <header>
    <div class="header-inner">
      <div>
        <div class="logo">Groundwork</div>
        <div class="logo-sub">Development intelligence</div>
      </div>
      <div class="edition-block">
        <div class="edition-label" id="edition-label">Latest edition</div>
        <div class="edition-date" id="edition-date">Loading...</div>
        <div class="edition-next" id="edition-next"></div>
      </div>
    </div>
    <div class="city-tabs">
      <button class="city-tab active" data-city="milwaukee">Milwaukee, WI</button>
      <button class="city-tab" data-city="madison">Madison, WI</button>
      <button class="city-tab" data-city="fortlauderdale">Fort Lauderdale, FL</button>
    </div>
  </header>

  <div class="meta-bar">
    <span id="meta-radius">50-mile radius</span>
    <span class="meta-sep">·</span>
    <span id="project-count">Loading...</span>
    <span class="meta-sep">·</span>
    <span>Auto-updated Mon &amp; Thu</span>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All <span class="filter-count" id="count-all"></span></button>
    <button class="filter-btn" data-filter="ground-up">Ground-Up <span class="filter-count" id="count-ground-up"></span></button>
    <button class="filter-btn" data-filter="renovation">Renovation <span class="filter-count" id="count-renovation"></span></button>
    <button class="filter-btn" data-filter="master-plan">Master plan <span class="filter-count" id="count-master-plan"></span></button>
  </div>

  <div class="grid" id="grid">
    <div class="loading">Loading projects...</div>
  </div>

  <div class="archive-section" id="archive-section" style="display:none">
    <div class="archive-title">Past editions</div>
    <div class="archive-list" id="archive-list"></div>
  </div>

  <footer>
    <span>Groundwork · Development Intelligence</span>
    <span>Auto-generated · Updated Mon &amp; Thu</span>
  </footer>
</div>

<script>
  const TYPE = {
    'ground-up':   { label: 'Ground-Up',   bg: '#E1F5EE', tc: '#085041', bc: '#1D9E75' },
    'renovation':  { label: 'Renovation',  bg: '#FAEEDA', tc: '#633806', bc: '#BA7517' },
    'master-plan': { label: 'Master plan', bg: '#E6F1FB', tc: '#0C447C', bc: '#378ADD' }
  };

  const CITIES = {
    milwaukee:      { file: 'data/milwaukee.json',      radius: '50-mile radius' },
    madison:        { file: 'data/madison.json',        radius: '40-mile radius' },
    fortlauderdale: { file: 'data/fortlauderdale.json', radius: '30-mile radius' }
  };

  let allProjects = [];
  let activeFilter = 'all';
  let activeCity = 'milwaukee';

  function getNextUpdate() {
    const now = new Date();
    const day = now.getDay();
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    let daysUntil;
    if (day < 1) daysUntil = 1 - day;
    else if (day < 4) daysUntil = 4 - day;
    else daysUntil = 8 - day;
    const next = new Date(now);
    next.setDate(now.getDate() + daysUntil);
    return 'Next update ' + days[next.getDay()] + ', ' + next.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function renderCard(p) {
    const t = TYPE[p.type] || TYPE['ground-up'];
    const credits = (p.developer || p.architect) ? `
      <div class="card-credits">
        ${p.developer ? `<span>Developer:</span> ${p.developer}<br>` : ''}
        ${p.architect ? `<span>Architect:</span> ${p.architect}` : ''}
      </div>` : '';
    return `
      <div class="card" style="border-left-color:${t.bc}">
        <div class="card-top">
          <span class="type-badge" style="background:${t.bg};color:${t.tc}">${t.label}</span>
          <span class="card-status">${p.status || ''}</span>
        </div>
        <div class="card-name">${p.name}</div>
        <div class="card-location">${p.location}</div>
        <div class="card-scale" style="background:${t.bg};color:${t.tc}">${p.scale || ''}</div>
        ${credits}
        <div class="card-summary">${p.summary}</div>
        <div class="card-footer">
          <span class="card-source">${p.source}</span>
          ${p.link ? `<a class="card-link" href="${p.link}" target="_blank" rel="noopener">Read more →</a>` : '<span class="card-source">' + (p.date || '') + '</span>'}
        </div>
      </div>`;
  }

  function renderGrid(projects) {
    const grid = document.getElementById('grid');
    const filtered = activeFilter === 'all' ? projects : projects.filter(p => p.type === activeFilter);
    grid.innerHTML = filtered.length
      ? filtered.map(renderCard).join('')
      : '<div class="empty-state">No projects in this category this edition.</div>';
  }

  function updateCounts(projects) {
    document.getElementById('count-all').textContent = projects.length;
    ['ground-up','renovation','master-plan'].forEach(t => {
      document.getElementById('count-' + t).textContent = projects.filter(p => p.type === t).length;
    });
    document.getElementById('project-count').textContent = projects.length + ' project' + (projects.length !== 1 ? 's' : '') + ' this edition';
  }

  function loadEdition(edition) {
    allProjects = edition.projects || [];
    document.getElementById('edition-date').textContent = edition.editionDate || '';
    document.getElementById('edition-next').textContent = getNextUpdate();
    activeFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
    updateCounts(allProjects);
    renderGrid(allProjects);
  }

  async function loadCity(city) {
    activeCity = city;
    const cfg = CITIES[city];
    document.getElementById('meta-radius').textContent = cfg.radius;
    document.getElementById('edition-date').textContent = 'Loading...';
    document.getElementById('grid').innerHTML = '<div class="loading">Loading projects...</div>';
    document.getElementById('archive-section').style.display = 'none';
    document.getElementById('archive-list').innerHTML = '';

    try {
      const res = await fetch('./' + cfg.file + '?t=' + Date.now());
      const data = await res.json();

      if (!data.editions || !data.editions.length) {
        document.getElementById('grid').innerHTML = '<div class="empty-state">No editions yet — check back Monday or Thursday.</div>';
        document.getElementById('edition-date').textContent = 'No editions yet';
        return;
      }

      document.getElementById('edition-label').textContent = 'Latest edition';
      loadEdition(data.editions[0]);

      if (data.editions.length > 1) {
        const archiveSection = document.getElementById('archive-section');
        const archiveList = document.getElementById('archive-list');
        archiveSection.style.display = 'block';

        const latestItem = document.createElement('div');
        latestItem.className = 'archive-item active';
        latestItem.innerHTML = `<span class="archive-item-date">Latest edition</span><span class="archive-item-count">${data.editions[0].projectCount} projects</span>`;
        latestItem.addEventListener('click', () => {
          document.querySelectorAll('.archive-item').forEach(x => x.classList.remove('active'));
          latestItem.classList.add('active');
          document.getElementById('edition-label').textContent = 'Latest edition';
          loadEdition(data.editions[0]);
        });
        archiveList.appendChild(latestItem);

        data.editions.slice(1).forEach(ed => {
          const item = document.createElement('div');
          item.className = 'archive-item';
          item.innerHTML = `<span class="archive-item-date">${ed.editionDate}</span><span class="archive-item-count">${ed.projectCount} projects</span>`;
          item.addEventListener('click', () => {
            document.querySelectorAll('.archive-item').forEach(x => x.classList.remove('active'));
            item.classList.add('active');
            document.getElementById('edition-label').textContent = 'Past edition';
            loadEdition(ed);
          });
          archiveList.appendChild(item);
        });
      }

    } catch (e) {
      document.getElementById('grid').innerHTML = '<div class="empty-state">Could not load projects. Check back soon.</div>';
      document.getElementById('edition-date').textContent = '—';
    }
  }

  document.querySelectorAll('.city-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.city-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      loadCity(tab.dataset.city);
    });
  });

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGrid(allProjects);
  });

  loadCity('milwaukee');
</script>
</body>
</html>
